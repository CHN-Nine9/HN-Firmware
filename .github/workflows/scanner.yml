name: Incremental Scanner

on:
  push:                # 提交时触发
  schedule:
    - cron: '0 */8 * * *'   # 每8小时自动运行
  workflow_dispatch:        # 手动触发
    inputs:
      continued:
        description: 'Indicates if this is an automatically continued run'
        required: false
        type: string

concurrency: 
  group: scanner-group
  cancel-in-progress: false

permissions:
  contents: read
  actions: write            # 允许触发新的工作流

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300    # 5小时超时（留有余量）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 仅恢复缓存（使用动态后缀匹配最近一次）
      - name: Restore State (Cache)
        uses: actions/cache/restore@v4
        with:
          path: state
          # 加入 run_attempt 防止手动 re-run 时缓存键冲突报错
          key: scanner-state-v-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scanner-state-v-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run Scanner
        id: run
        env:
          BASE_URL: "https://iknow.service.hihonor.com/weknow/servlet/download/public"   # 替换为实际URL
        run: python scanner.py

      - name: Upload Full History
        uses: actions/upload-artifact@v4
        with:
          name: full-history-${{ github.run_id }}
          path: state/results.csv
          if-no-files-found: error

      - name: Upload New Records
        uses: actions/upload-artifact@v4
        with:
          name: new-records-${{ github.run_id }}
          path: state/new.csv
          if-no-files-found: error

      # 2. 强制在触发下一次运行前保存缓存
      - name: Save State (Cache)
        uses: actions/cache/save@v4
        with:
          path: state
          key: scanner-state-v-${{ github.run_id }}-${{ github.run_attempt }}

      # 3. 触发下一次运行（此时新缓存已安全保存完毕）
      - name: Trigger Next Run (if max entries reached)
        if: steps.run.outputs.should_continue == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'scanner.yml',   // 当前工作流文件名
              ref: context.ref,
              inputs: { continued: 'true' } // 传递已声明的参数
            });

      - name: Post Summary
        run: |
          echo "## ✅ Scan Completed" >> $GITHUB_STEP_SUMMARY
          if [ -f state/results.csv ]; then
            echo "Total records in history: $(($(wc -l < state/results.csv) - 1))" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f state/new.csv ]; then
            echo "New records this run: $(($(wc -l < state/new.csv) - 1))" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Next start ID: W$(cat state/next_start.txt | xargs printf '%08d')" >> $GITHUB_STEP_SUMMARY
