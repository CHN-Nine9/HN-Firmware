name: Incremental Scanner

on:
  push:                     # 代码提交时触发
  schedule:
    - cron: '0 */8 * * *'   # 定时任务：每 8 小时自动运行一次
  workflow_dispatch:        # 支持在 GitHub Actions 页面手动触发
    inputs:                 # 声明输入参数，防止 API 触发时报 422 错误
      continued:
        description: 'Indicates if this is an automatically continued run'
        required: false
        type: string

# 并发控制：确保同一时间只有一个扫描任务在运行。
# 如果有任务正在运行，新的触发（如 push 或定时）会排队等待，防止缓存被互相覆盖踩踏。
concurrency: 
  group: scanner-group
  cancel-in-progress: false 

permissions:
  contents: read
  actions: write            # 赋予写权限：这是使用 API 触发下一次工作流所必需的

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300    # 设置 5 小时超时上限，为单次 3250 条扫描留出充足余量

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------- 缓存机制：恢复阶段 ----------------
      # 注意：这里仅使用 restore，不进行 save。
      # 利用 restore-keys 的回退机制，按前缀匹配最近一次成功保存的进度。
      - name: Restore State (Cache)
        uses: actions/cache/restore@v4
        with:
          path: state
          # 使用 run_id 和 run_attempt 组合，确保每次生成的缓存键都是唯一的
          key: scanner-state-v-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scanner-state-v-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run Scanner
        id: run
        env:
          # 目标服务器基础 URL
          BASE_URL: "https://iknow.service.hihonor.com/weknow/servlet/download/public"   
        run: python scanner.py

      # ---------------- 产物上传：拆分为 4 个独立压缩包 ----------------
      
      - name: Upload 1 - Full History (All)
        uses: actions/upload-artifact@v4
        with:
          name: full-history-all-${{ github.run_id }}
          path: |
            state/results_all_with_url.csv
            state/results_all.json
            state/results_all.xml
          if-no-files-found: ignore   # 如果文件不存在则忽略，避免报错

      - name: Upload 2 - Full History (Valid Only)
        uses: actions/upload-artifact@v4
        with:
          name: full-history-valid-${{ github.run_id }}
          path: |
            state/valid_all_with_url.csv
            state/valid_all.json
            state/valid_all.xml
          if-no-files-found: ignore

      - name: Upload 3 - New Records (All)
        uses: actions/upload-artifact@v4
        with:
          name: new-records-all-${{ github.run_id }}
          path: |
            state/results_new_with_url.csv
            state/results_new.json
            state/results_new.xml
          if-no-files-found: ignore

      - name: Upload 4 - New Records (Valid Only)
        uses: actions/upload-artifact@v4
        with:
          name: new-records-valid-${{ github.run_id }}
          path: |
            state/valid_new_with_url.csv
            state/valid_new.json
            state/valid_new.xml
          if-no-files-found: ignore

      # ---------------- 缓存机制：保存阶段 ----------------
      # 关键修复：必须在 "Trigger Next Run" 之前强制保存缓存。
      # 这阻断了“竞态条件”，确保下一次运行被拉起时，最新的进度已经安全写入了缓存系统。
      - name: Save State (Cache)
        uses: actions/cache/save@v4
        with:
          path: state
          key: scanner-state-v-${{ github.run_id }}-${{ github.run_attempt }}

      # ---------------- 自动接力：触发下一次运行（带防堆叠检查） ----------------
      - name: Trigger Next Run
        if: steps.run.outputs.should_continue == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1. 查询当前仓库中处于 queued 或 in_progress 状态的工作流
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'scanner.yml',
              status: 'queued'
            });

            // 2. 如果已经有在排队的任务（例如 8 小时到了自动触发的 schedule），就不再重复派发
            const queuedRuns = runs.data.workflow_runs.filter(r => r.id !== context.runId);
            
            if (queuedRuns.length > 0) {
              console.log(`Found ${queuedRuns.length} queued run(s). Skipping dispatch to prevent accumulation.`);
              return;
            }

            console.log('No queued runs found. Triggering next sequential run...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'scanner.yml',
              ref: context.ref,
              inputs: { continued: 'true' }
            });

# ---------------- 运行摘要 ----------------
      # 在 GitHub Actions 运行页面的 Summary 面板输出直观的统计信息
      - name: Post Summary
        run: |
          # 辅助函数：统计 CSV 文件数据行数（剔除首行表头）
          get_csv_count() {
            if [ -f "$1" ]; then
              local lines=$(wc -l < "$1" | tr -d ' ')
              echo $(( lines > 0 ? lines - 1 : 0 ))
            else
              echo 0
            fi
          }

          THIS_TOTAL=$(get_csv_count state/new.csv)
          THIS_VALID=$(get_csv_count state/valid_new.csv)
          CUMULATIVE_TOTAL=$(get_csv_count state/results.csv)
          CUMULATIVE_VALID=$(get_csv_count state/valid_results.csv)
          NEXT_ID=$(printf "W%08d" "$(cat state/next_start.txt 2>/dev/null || echo 0)")

          # 计算运行耗时 (Duration)
          END_TIME=$(date +%s)
          START_TIME=${START_TIME:-$END_TIME}
          DURATION_SEC=$(( END_TIME - START_TIME ))
          DURATION_STR="$(printf '%dm %ds' $(( DURATION_SEC / 60 )) $(( DURATION_SEC % 60 )))"

          # 映射触发类型 (Trigger Event)
          EVENT_NAME="${{ github.event_name }}"
          case "$EVENT_NAME" in
            "workflow_dispatch") TRIGGER_TYPE="Manual Dispatch" ;;
            "push")              TRIGGER_TYPE="Push" ;;
            "schedule")          TRIGGER_TYPE="Schedule (Cron)" ;;
            *)                   TRIGGER_TYPE="$EVENT_NAME" ;;
          esac

          {
            echo "## ✅ Scan Completed"
            echo ""
            echo "### ⏱️ Current Run"
            echo "* 🔍 **Scanned Entries**: ${THIS_TOTAL}"
            echo "* 🎯 **Valid Entries**: ${THIS_VALID}"
            echo ""
            echo "### 📊 Cumulative Total"
            echo "* 📈 **Total Scanned**: ${CUMULATIVE_TOTAL}"
            echo "* 🏆 **Total Valid**: ${CUMULATIVE_VALID}"
            echo ""
            echo "### ⏭️ Next Run"
            echo "* 🆔 **Next Start ID**: ${NEXT_ID}"
            echo ""
            echo "<details>"
            echo "<summary>ℹ️ <b>Run Details & Metadata</b></summary>"
            echo ""
            echo "* 🆔 **Run ID / Attempt**: ${{ github.run_id }} (#${{ github.run_attempt }})"
            echo "* ⏳ **Execution Time**: ${DURATION_STR}"
            echo "* ⚡ **Trigger Event**: ${TRIGGER_TYPE}"
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
